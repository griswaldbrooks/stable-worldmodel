[project]
name = "stable-worldmodel"
version = "0.1.0"
description = "World Model Research Made Simple"
readme="README.md"
license="MIT"
authors = [{name = "Lucas Maes"}, {name = "Quentin Le Lidec"}, {name = "Randall Balestriero"}]
maintainers = [{name = "Lucas Maes", email = "lucas_maes@brown.edu"}]
urls = {Homepage = "http://github.com/galilai-group/stable-worldmodel"}
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "loguru",
  "tabulate",
  "gymnasium",
  "einops",
  "lancedb>=0.30.0",
  "pylance>=4.0.0",
  "pyarrow",
  "pillow",
  "tqdm",
  "typer",
  "rich",
]

[project.scripts]
swm = "stable_worldmodel.cli:app"

[project.optional-dependencies]
train = [
    "transformers>=4.50.0",
    "stable-pretraining>=0.1.7",
    "hydra-core",
    "hydra-submitit-launcher",
    "wandb",
]

env = [
    "pygame",
    "pymunk",
    "shapely",
    "ogbench",
    "minigrid",
    "gymnasium[all]",
    "gymnasium-robotics",
    "opencv-python",
    "stable_baselines3>=2.0.0",
    "craftax>=1.5.0",
    "ale-py",
]

format = [
    "h5py",
    "hdf5plugin",
    "decord",
    "imageio[ffmpeg]",
]

# Genesis simulator stack (SO-101 env). Heavy, so opt-in:
# `uv sync --extra genesis`. Nyx renderer needs an NVIDIA GPU with
# CUDA 12.9+ / driver 575+; alpha 0.1.x wheels, so cap the minor.
genesis = [
    "genesis-world>=1.0.0,<2",
    "gs-nyx>=0.1.1,<0.2",
    "gs-nyx-plugin>=0.1.2,<0.2",
]

lerobot = [
    "lerobot>=0.5.0; python_version >= '3.12'",
]

all = [
    "stable-worldmodel[train,env,format]",
]

[dependency-groups]
dev = [
  "ipdb",
  "pre-commit",
  "pytest",
  "pytest-cov>=7.0.0",
  "ruff",
  "twine",
  "mkdocs-shadcn",
  "pymdown-extensions",
  "pillow",
  "decord",
  "imageio[ffmpeg]",
  "mkdocstrings[python]",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
source-exclude = [
    "**/.mypy_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.pytest.ini_options]
markers = [
    "gpu: requires a CUDA GPU (deselected by default; run with -m gpu)",
    "genesis: requires the Genesis simulator stack (deselected by default; run with -m genesis after `uv sync --extra genesis`)",
]
# Skip gpu + genesis by default so CI and quick runs stay lean. A -m on
# the command line overrides this (later -m wins).
addopts = "-m 'not gpu and not genesis'"

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.coverage.run]
omit = ["stable_worldmodel/envs/*"]
